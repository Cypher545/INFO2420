<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Native Cooking of Utah - Graphics</title>

<style type="text/css">


	#thumbs, #image {
		width: 700x;
		border: solid 1px #000;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
		background: #eee;
		padding: 5px;
	}

	#thumbs {
		margin-top: 10px;
	}

			
	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
	}

	#image{
		height:400px;
	}

	.instructions{
		font-style:italic;
	}

</style>

<script language="JavaScript" type="text/javascript">

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "images/Print1.jpg"
	PrintButton2.src = "images/Print2.jpg"
	logo1.src = "images/Logo1.gif"
	logo2.src = "images/Logo2.jpg"
}


		var imgArray = new Array(
			'image1lg.jpg',
			'image2lg.jpg',
			'image3lg.jpg',
			'image4lg.jpg'
			

		);


		var titleArray = new Array(
			'Master Chef Pierre DeBois',
			'Meat on a grill',
			'A glass of wine',
			'Table of food'
			
		);
			
		var imgPath = "images/fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">

<div align="center">


<div>
	<a href="" onmouseover="document.getElementById('print').src='images/Print2.jpg';"
	onmouseout="document.getElementById('print').src='images/Print1.jpg';">
	<img src="images/Print1.jpg" alt="Print Page" width="200" height="50"
	id="print"></a>
</div>

<div>
	<a href="logo.html"
	   onMouseOver="document.getElementById('logoImage').src = logo2.src;"
	   onMouseOut="document.getElementById('logoImage').src = logo1.src;">
		<img id="logoImage" src="images/Logo1.gif" width="133" height="126"
		     alt="Logo" style="border:none;"/>
	</a>
</div>

<br />
<br />
<br />
<br />


<div id="thumbs">
		<img src="images/thumbnail/image1sm.jpg" alt="Master Chef Pierre DeBois" onmouseover="swapImage(0);" />
		<img src="images/thumbnail/image2sm.jpg" alt="Meat on a grill" onmouseover="swapImage(1);" />
		<img src="images/thumbnail/image3sm.jpg" alt="A glass of wine" onmouseover="swapImage(2);" />
		<img src="images/thumbnail/image4sm.jpg" alt="Table of food" onmouseover="swapImage(3);" />
		
</div>

	<div id="image">

		<img id="theImage" src="images/fullsize/image1lg.jpg" alt="Master Chef Pierre DeBois" />
		<h3 id="bottomText">Master Chef Pierre DeBois</h3>
	</div>

<img src="images/2colback.jpg">

<br />
<br />
<br />
<br />



</div>

<p>
    <a href="http://validator.w3.org/check?uri=referer"><img
      src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
</p>
  

</body>
</html>
